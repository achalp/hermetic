name: Release

# Tag-driven releases (phase 1 of the release path):
#   git tag v0.2.0 && git push origin v0.2.0
# Gate (lint/type-check/tests/build) → sandbox image to GHCR → GitHub Release
# with auto-generated notes. Tags containing '-' (v0.2.0-rc.1) publish as
# PRERELEASES, so the pipeline itself is testable without shipping a "latest".
on:
  push:
    tags: ["v*"]

# Least privilege at the top; each job opts up to exactly what it needs, so the
# pure `gate` job (which runs untrusted install + build) holds no write token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # gate runs only the local suite; it needs no write scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Parity with the PR gate (.github/workflows/ci.yml) — the release commit
      # must clear the SAME bar, not a weaker subset.
      - run: pnpm run lint
      - run: node scripts/check-data-hygiene.mjs
      - run: pnpm run ratchet
      - run: pnpm run isolation
      - run: pnpm run format:check
      - run: pnpm run type-check
      - run: pnpm test:coverage
      - run: pnpm run build
        env:
          ANTHROPIC_API_KEY: test-key-for-build

  sandbox-image:
    name: Sandbox image → GHCR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC for build-provenance attestation
      attestations: write # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-sandbox
          TAG=${GITHUB_REF_NAME#v}
          docker build -t "$IMAGE:$TAG" docker/sandbox
          docker push "$IMAGE:$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # Only stable tags move :latest — an rc must never become the default pull.
          if [[ "$TAG" != *-* ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [gate, sandbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$GITHUB_REF_NAME
          FLAGS=""
          [[ "$TAG" == *-* ]] && FLAGS="--prerelease"
          REPO="${{ github.repository }}"
          gh release create "$TAG" --generate-notes $FLAGS \
            --notes "Sandbox image: \`ghcr.io/${REPO}-sandbox:${TAG#v}\`

          Claude Desktop extension: \`hermetic.mcpb\` (attached below — Settings → Extensions → Install Extension)

          **Verify artifacts** (build provenance is attested via GitHub):
          \`\`\`
          gh attestation verify oci://ghcr.io/${REPO}-sandbox:${TAG#v} --repo ${REPO}
          gh attestation verify hermetic.mcpb --repo ${REPO}
          sha256sum -c hermetic.mcpb.sha256
          \`\`\`"

  mcpb:
    name: MCPB bundle → Release asset
    needs: [gate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the asset to the release
      id-token: write # OIDC for build-provenance attestation
      attestations: write # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run mcpb:build
      - run: pnpm run mcpb:smoke
      - name: Attest bundle build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: hermetic.mcpb
      - name: Checksum and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum hermetic.mcpb > hermetic.mcpb.sha256
          gh release upload "$GITHUB_REF_NAME" hermetic.mcpb hermetic.mcpb.sha256 --clobber
