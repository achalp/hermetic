name: Release

# Tag-driven releases (phase 1 of the release path):
#   git tag v0.2.0 && git push origin v0.2.0
# Gate (lint/type-check/tests/build + Python contract mirror) → sandbox image to
# GHCR → GitHub Release that BUILDS + smokes + attests the .mcpb and attaches it
# atomically at creation (a bundle failure blocks publication). Tags containing
# '-' (v0.2.0-rc.1) publish as PRERELEASES, so the pipeline itself is testable
# without shipping a "latest".
on:
  push:
    tags: ["v*"]

# Least privilege at the top; each job opts up to exactly what it needs, so the
# pure `gate` job (which runs untrusted install + build) holds no write token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # gate runs only the local suite; it needs no write scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Re-verify the EXACT tagged commit against the core of the PR gate
      # (.github/workflows/ci.yml): lint, hygiene, ratchet, isolation, format,
      # type-check, full tests + coverage, build — PLUS the Python runtime
      # contract mirror below (the shipped sandbox's interpreter). The browser
      # e2e, golden-transcripts, and Node-20 matrix leg run on the PR that gates
      # every commit into main and are deliberately NOT re-run here to keep a tag
      # push fast — so this is a strong re-check of the release commit, not the
      # literal superset of ci.yml. (Branch protection making that PR pass
      # mandatory before merge is the belt to this suspenders — see README.)
      - run: pnpm run lint
      - run: node scripts/check-data-hygiene.mjs
      - run: pnpm run ratchet
      - run: pnpm run isolation
      - run: pnpm run format:check
      - run: pnpm run type-check
      - run: pnpm test:coverage
      - run: pnpm run build
        env:
          ANTHROPIC_API_KEY: test-key-for-build
      # The sandbox image ships this interpreter + these pinned libs; the mirror
      # catches Python<->JSON contract drift that would break the shipped image.
      - name: Set up Python (matches the sandbox image)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Python runtime contract mirror
        run: |
          pip install pandas==2.2.3 numpy==2.2.4 scipy==1.15.2
          python3 -m unittest docker.sandbox.hermetic_runtime.test_runtime

  sandbox-image:
    name: Sandbox image → GHCR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC for build-provenance attestation
      attestations: write # write the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-sandbox
          TAG=${GITHUB_REF_NAME#v}
          docker build -t "$IMAGE:$TAG" docker/sandbox
          docker push "$IMAGE:$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # Only stable tags move :latest — an rc must never become the default pull.
          if [[ "$TAG" != *-* ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Build + smoke + attest the .mcpb, THEN create the release with the bundle
  # and its checksum attached at creation. Ordering matters: the old pipeline
  # published the GitHub Release first and built the bundle in a later job, so a
  # bundle build/smoke failure left a public release whose notes referenced a
  # `hermetic.mcpb` asset that never uploaded. Now a bundle failure aborts before
  # any release exists, and `gh release create` attaches the assets atomically.
  release:
    name: GitHub Release (+ attested bundle)
    needs: [gate, sandbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release + upload assets
      id-token: write # OIDC for build-provenance attestation
      attestations: write # write the bundle provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run mcpb:build
      - run: pnpm run mcpb:smoke
      - name: Attest bundle build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: hermetic.mcpb
      - name: Create release with the attested, checksummed bundle attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$GITHUB_REF_NAME
          FLAGS=""
          [[ "$TAG" == *-* ]] && FLAGS="--prerelease"
          REPO="${{ github.repository }}"
          sha256sum hermetic.mcpb > hermetic.mcpb.sha256
          gh release create "$TAG" hermetic.mcpb hermetic.mcpb.sha256 --generate-notes $FLAGS \
            --notes "Sandbox image: \`ghcr.io/${REPO}-sandbox:${TAG#v}\`

          Claude Desktop extension: \`hermetic.mcpb\` (attached below — Settings → Extensions → Install Extension)

          **Verify artifacts** (build provenance is attested via GitHub):
          \`\`\`
          gh attestation verify oci://ghcr.io/${REPO}-sandbox:${TAG#v} --repo ${REPO}
          gh attestation verify hermetic.mcpb --repo ${REPO}
          sha256sum -c hermetic.mcpb.sha256
          \`\`\`"

  # Desktop bundles (build log D42). Runs AFTER the release exists and uploads
  # into it, because a packaged desktop build is far too slow to hold release
  # creation. That is a deliberate departure from the .mcpb's atomic-attach
  # rule, so the release NOTES never promise a desktop asset: a failure here
  # leaves a release visibly WITHOUT bundles rather than one whose notes point
  # at files that never uploaded.
  #
  # `latest.json` is NOT built here — the updater-manifest job below assembles
  # it from the release's actual assets after every leg finishes. A per-leg
  # manifest with --clobber would leave whichever platform uploaded last as the
  # ONLY platform in the manifest.
  desktop:
    name: Desktop bundle (${{ matrix.platform }})
    needs: [gate, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # SIGNING STATUS (deliberate, decided 2026-09): every self-updatable
          # bundle is minisign-signed for the UPDATER (TAURI_SIGNING_PRIVATE_KEY;
          # build-updater-manifest throws without the .sig) and provenance-
          # attested — but nothing is OS code-signed yet. macOS ships ad-hoc-
          # signed (tauri.conf.json5 signingIdentity "-"; Gatekeeper warns on
          # first open), Windows ships an unsigned NSIS installer (SmartScreen
          # warns). Replace with Developer ID + notarization / an Authenticode
          # cert when those secrets exist — the rows stay as they are.
          #
          # `attest` is the per-platform provenance subject list: everything we
          # upload that a user can install (incl. .deb/.rpm — they skip the
          # updater but are still downloads worth verifying).
          - os: ubuntu-latest
            platform: linux-x86_64
            attest: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-latest # Apple Silicon
            platform: darwin-aarch64
            attest: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: macos-15-intel
            platform: darwin-x86_64
            # `bundles: app` + HERMETIC_HDIUTIL_DMG: Tauri's bundle_dmg.sh
            # (create→mount→style→detach→convert) hung 14 minutes and died on
            # this runner (v0.3.0-rc.1, orphaned diskimages-help — detach is
            # the classic hang point), so build-desktop.mjs makes the dmg
            # itself with one un-mounted `hdiutil create` + timeout/retries.
            bundles: app
            hdiutilDmg: "1"
            attest: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            # Requires Next >= 16.2: 16.1's Turbopack emitted `:` in chunk
            # filenames (NTFS ADS separator, EINVAL — vercel/next.js#89985;
            # killed the v0.3.0-rc.2 leg). nsis ONLY: an .msi would also map
            # to the windows-x86_64 updater key and buildUpdaterManifest
            # rejects the ambiguity (two bundles, one platform).
            bundles: nsis
            attest: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write # upload bundles onto the release
      id-token: write # OIDC for build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install webkit/gtk dev headers (same set as ci.yml tauri-shell)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - run: pnpm install --frozen-lockfile
      # The same script a maintainer runs locally (start.sh option 1): builds the
      # egress-fetch release bin, purges Tauri's copy-only resource staging, then
      # assembles the sidecar (which prunes foreign-native prebuilds — one musl
      # .node aborts linuxdeploy) and bundles.
      - name: Build desktop bundles (updater-signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HERMETIC_TAURI_BUNDLES: ${{ matrix.bundles }}
          HERMETIC_HDIUTIL_DMG: ${{ matrix.hdiutilDmg }}
        run: node scripts/build-desktop.mjs
      - name: Attest bundle build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: ${{ matrix.attest }}
      - name: Upload bundles
        shell: bash # the Windows leg would otherwise get pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One glob set for every leg — nullglob drops the other platforms'
          # dirs. `*.sig` siblings ride along via the trailing `*`.
          B=src-tauri/target/release/bundle
          ASSETS=("$B"/appimage/*.AppImage* "$B"/deb/*.deb "$B"/rpm/*.rpm)
          ASSETS+=("$B"/dmg/*.dmg "$B"/macos/*.app.tar.gz*)
          ASSETS+=("$B"/nsis/*-setup.exe*)
          [[ ${#ASSETS[@]} -gt 0 ]] || { echo "no bundles produced" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber

  # `latest.json` is what installed apps poll, so it is written LAST, in its own
  # job, from the assets that ACTUALLY uploaded — every URL it names is already
  # live, and one slow/failed leg cannot clobber another platform out of the
  # manifest. It runs even when a desktop leg failed (fail-fast: false above):
  # surviving platforms still get updates; a failed platform is simply absent
  # (its installs see "no update available" — a visible red leg in this run,
  # not a broken updater). build-updater-manifest.mts still throws on an
  # updatable asset missing its .sig and on an empty platform set.
  updater-manifest:
    name: Update manifest (latest.json)
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload latest.json onto the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build latest.json from the release's uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/build-updater-manifest.mts "$GITHUB_REF_NAME" --from-release
      - name: Upload the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # LAST: only now can an installed app discover this version.
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
