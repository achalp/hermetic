name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# package-lock.json is intentionally gitignored (see .gitignore), so this
# repo uses `npm install` rather than `npm ci` and can't use setup-node's
# lockfile-keyed cache. We drop the standalone cache action too so every
# action here runs on the supported Node 24 runtime.

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: test-key-for-build

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
