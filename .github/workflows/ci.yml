name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dependencies are managed with pnpm. The committed pnpm-lock.yaml is
# registry-agnostic (content-addressed integrity), so the SAME lockfile
# installs against a corporate Artifactory mirror on local machines and the
# public npm registry here in CI. `--frozen-lockfile` guarantees the install
# matches the lockfile exactly (the equivalent of `npm ci`).

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Modularization ratchet
        run: pnpm run ratchet

      - name: Package isolation check
        run: pnpm run isolation

      - name: Format check
        run: pnpm run format:check

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: test-key-for-build

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

  # Python runtime tests: the ONLY guard on Python<->JSON contract drift.
  # docker/sandbox/hermetic_runtime/test_runtime.py mirrors the series-kind,
  # payload, and field-contract JSON the TypeScript side reads — those mirror
  # assertions (test_*_contract_mirror_matches_the_host_json) fail loudly when
  # the two languages diverge. Stdlib unittest, no third-party deps: pandas/
  # numpy-dependent cases skip cleanly when absent, so no install step is
  # needed and the mirror/contract tests still run. Invoked from repo root so
  # the host-JSON mirror paths resolve.
  python-runtime:
    name: Python Runtime Contract Mirror
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run runtime tests (contract mirror)
        run: python3 -m unittest docker.sandbox.hermetic_runtime.test_runtime

  # Golden transcripts: replay-mode server + journey runner, fully offline
  # (LLM responses come from committed fixtures in test-fixtures/llm/;
  # scripts/golden/run-journeys.mjs header documents the recording flow).
  golden-transcripts:
    name: Golden Transcripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sandbox image
        run: docker build -t hermetic-sandbox ./docker/sandbox/

      - name: Build app
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: test-key-replay-only

      - name: Start server (replay mode) and check journeys
        env:
          HERMETIC_LLM_MODE: replay
          ANTHROPIC_API_KEY: test-key-replay-only
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/providers >/dev/null && break
            sleep 2
          done
          node scripts/golden/run-journeys.mjs check

      - name: CLI harness proof (offline, no server)
        env:
          HERMETIC_LLM_MODE: replay
          ANTHROPIC_API_KEY: test-key-replay-only
        run: |
          # The libraries must be drivable with no Next server in-process
          # (Phase 1 exit criterion #1). Filename must match the recorded
          # fixture (the journey runner uploads as fixture.csv).
          cp test-specs/data/01-saas-mrr.csv /tmp/fixture.csv
          pnpm cli ask "What is the MRR trend over time?" /tmp/fixture.csv --out /tmp/cli-spec.ndjson
          grep -q '"path":"/root"' /tmp/cli-spec.ndjson
          ! grep -q '"value":"error"' /tmp/cli-spec.ndjson

      - name: Harness stays framework-free
        run: |
          # The CLI/MCP + harness layers must never import Next (lib is
          # lint-enforced; this guards the harness files themselves).
          ! grep -rE 'from "next(/|")' src/cli src/harness src/mcp

      - name: Egress allowlist proof (real containers, internal network)
        run: npx tsx scripts/egress-proof.ts

      - name: MCP harness proof (offline, real server over stdio)
        env:
          HERMETIC_LLM_MODE: replay
          ANTHROPIC_API_KEY: test-key-replay-only
        run: |
          # Same fixtures as the CLI proof; additionally builds and exercises
          # the embedded viewer end-to-end (mcp-server spec §4 M5).
          pnpm mcp:build-viewer
          node scripts/mcp-proof.mjs

      # On a replay miss the middleware writes <hash>.miss.json next to the
      # fixtures (the attempted params). Upload those plus the received
      # transcripts so a CI-only divergence can be diffed against the
      # recorded fixtures without reproducing the runner environment.
      - name: Upload miss diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-miss-diagnostics
          path: |
            test-fixtures/llm/*.miss.json
            test-fixtures/golden/*.received.ndjson
          if-no-files-found: ignore
