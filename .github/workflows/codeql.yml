name: CodeQL

# Static analysis (SAST) for the JS/TS surface. Runs on every PR and push, plus
# a weekly schedule so a newly-published query catches a latent issue in code
# that hasn't changed. Findings surface in the repo's Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # Mondays 03:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          # security-extended: more queries, more triage — worth it for a
          # product whose pitch is the security boundary. Python (the sandbox
          # runtime + proxies) is covered by ruff's S rules in ci.yml, not
          # scanned here: CodeQL's python extractor needs a pip-installable
          # package layout the docker/sandbox tree does not have.
          queries: security-extended

      # JS/TS is interpreted — no build step; CodeQL analyzes the source tree.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:javascript-typescript"
