name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect source …
        2. Ask "…"
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hermetic version / commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node.js version, Docker version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any secrets. Do NOT paste real credentials or private data.
      render: shell
